[package]
name = "anthilus"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Anthilus is a lightweight file manager for you Linux terminal!"
keywords = ["file", "manager", "files", "tui"]
readme = "README.md"
repository = "https://github.com/left-alert-chaos/anthilus"
exclude = [
	"directory_generator.py",
	"files_to_read",
	"CHANGELOG.md",
]

[build-dependencies]
cc = "1.11.2"
